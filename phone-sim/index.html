<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>케어드라이브 폰 시뮬레이터</title>
<style>
  :root {
    --bg: #eef2f7; --card: #ffffff; --ink: #0f172a; --sub: #64748b; --line: #e2e8f0;
    --acc: #0f766e; --warn: #c2410c; --l0: #14b8a6; --l1: #eab308; --l2: #f97316; --l3: #f43f5e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin: 4px 2px 12px; }
  h1 { font-size: 20px; margin: 0; }
  .sim { font-size: 12px; font-weight: 700; color: var(--warn); background: #fff1e8; border-radius: 6px; padding: 2px 8px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(15,23,42,.06); }
  h2 { font-size: 13px; color: var(--sub); margin: 0 0 10px; font-weight: 700; letter-spacing: .02em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
  .row label { flex: 1; }
  .row output { font-weight: 700; min-width: 72px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--acc); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; background: var(--line); color: var(--ink); }
  button.primary { background: var(--acc); color: #fff; }
  button.danger { background: var(--l3); color: #fff; }
  button.on { background: var(--ink); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .peers { display: flex; gap: 14px; font-size: 13px; color: var(--sub); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; margin-right: 6px; vertical-align: 1px; }
  .dot.ok { background: var(--l0); }
  .car { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; }
  .level { font-size: 22px; font-weight: 800; }
  .muted { color: var(--sub); font-size: 13px; }
  .switch { display: flex; align-items: center; gap: 10px; }
  .switch input { width: 20px; height: 20px; accent-color: var(--acc); }
  select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1>케어드라이브 폰</h1>
    <span class="sim">시뮬레이션 데이터</span>
  </header>

  <section class="card">
    <h2>연결</h2>
    <div class="peers">
      <span><i class="dot" id="dotRelay"></i>중계 서버</span>
      <span><i class="dot" id="dotCar"></i>차량 앱</span>
    </div>
  </section>

  <section class="card">
    <h2>차 화면 상태</h2>
    <div class="car">
      <span class="level" id="carLevel">-</span><span class="muted" id="carReason"></span>
      <span class="muted">운전</span><span id="carDriving">-</span>
      <span class="muted">스트레스</span><span id="carStress">-</span>
      <span class="muted">최근 동작</span><span id="carEvent" class="muted">-</span>
    </div>
  </section>

  <section class="card">
    <h2>오늘 컨디션 (삼성 헬스에서 읽은 값)</h2>
    <div class="row"><label for="sleep">어젯밤 수면</label><output id="sleepOut"></output></div>
    <input id="sleep" type="range" min="120" max="600" step="10" value="280">
    <div class="row"><label for="energy">에너지 점수</label><output id="energyOut"></output></div>
    <input id="energy" type="range" min="10" max="100" step="1" value="45">
    <div class="row"><label for="resting">안정 심박</label><output id="restingOut"></output></div>
    <input id="resting" type="range" min="45" max="95" step="1" value="68">
    <div class="row"><label for="spo2">수면 중 최저 산소포화도</label><output id="spo2Out"></output></div>
    <input id="spo2" type="range" min="82" max="100" step="1" value="95">
    <div class="row"><label for="skin">피부온도 (평소 대비)</label><output id="skinOut"></output></div>
    <input id="skin" type="range" min="-1" max="2" step="0.1" value="0.2">
    <div class="row"><label for="bp">최근 수축기 혈압</label><output id="bpOut"></output></div>
    <input id="bp" type="range" min="100" max="200" step="1" value="128">
    <div class="row"><label for="baseRmssd">평소 심박변이도 (워치 앱)</label><output id="baseRmssdOut"></output></div>
    <input id="baseRmssd" type="range" min="15" max="80" step="1" value="42">
    <div class="row"><label for="mood">기분 (출발 전 직접 입력)</label>
      <select id="mood"><option value="">차에서 고르기</option><option value="GOOD">좋아요</option><option value="OK">보통</option><option value="TIRED">피곤해요</option><option value="STRESSED">스트레스</option></select>
    </div>
    <div class="row switch"><input id="apnea" type="checkbox"><label for="apnea">수면무호흡 감지 기록</label></div>
    <div class="row switch"><input id="recentIhrn" type="checkbox"><label for="recentIhrn">최근 부정맥 알림</label></div>
    <div class="row switch"><input id="exercise" type="checkbox"><label for="exercise">30분 안에 운동함</label></div>
    <button class="primary" id="sendCondition">차로 보내기</button>
  </section>

  <section class="card">
    <h2>실시간 (워치)</h2>
    <div class="row"><label for="hr">심박</label><output id="hrOut"></output></div>
    <input id="hr" type="range" min="35" max="160" step="1" value="74">
    <div class="row switch"><input id="glucoseOn" type="checkbox"><label for="glucoseOn">연속혈당측정기 연결</label><output id="glucoseOut"></output></div>
    <input id="glucose" type="range" min="40" max="200" step="1" value="105" disabled>
    <div class="row switch"><input id="hrvOn" type="checkbox"><label for="hrvOn">심박변이도 (워치 앱 박동 간격)</label><output id="rmssdOut"></output></div>
    <input id="rmssd" type="range" min="8" max="80" step="1" value="40" disabled>
    <div class="row"><label for="jitter">심박 자연스럽게 흔들기</label><input id="jitter" type="checkbox" checked></div>
  </section>

  <section class="card">
    <h2>이벤트</h2>
    <div class="chips">
      <button class="danger" id="sendIhrn">부정맥 알림 보내기</button>
      <button id="driveOn">주행 시작</button>
      <button id="driveOff">정차</button>
      <button id="driveReal">실제 기어 사용</button>
      <button id="adv10">+10분</button>
      <button id="adv30">+30분</button>
      <button id="scenario">시나리오 ▶</button>
    </div>
    <p class="muted">주행·시간 버튼은 시연용입니다. 실제 차에서는 기어와 시간을 차가 알려줍니다.</p>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const LEVEL = { L0_NORMAL: ['정상', '--l0'], L1_CAUTION: ['주의', '--l1'], L2_WARNING: ['경고', '--l2'], L3_STOPPED: ['정차 후 조치', '--l3'] };
  const MOOD = { GOOD: '좋아요', OK: '보통', TIRED: '피곤해요', STRESSED: '스트레스' };
  const REASON = {
    NONE: '', HR_SUSTAINED: '심박 높음 지속', STRESS_HIGH: '스트레스 높음 지속', HR_HIGH: '심박 매우 높음', HR_LOW: '심박 매우 낮음',
    IHRN_NEW: '부정맥 알림', GLUCOSE_LOW: '저혈당', BREAK_DUE: '휴식 시간', BREAK_OVERDUE: '휴식 시간 초과',
  };

  let ws = null;
  const send = (msg) => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg)); };

  function connect() {
    ws = new WebSocket(`ws://${location.host}/phone`);
    ws.onopen = () => { $('dotRelay').classList.add('ok'); sendCondition(); sendLive(); };
    ws.onclose = () => { $('dotRelay').classList.remove('ok'); $('dotCar').classList.remove('ok'); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'peers') {
        $('dotCar').classList.toggle('ok', m.car);
        if (m.car) { sendCondition(); sendLive(); }
      }
      if (m.type === 'status') showStatus(m);
    };
  }

  function showStatus(s) {
    const [label, color] = LEVEL[s.level] ?? [s.level, '--sub'];
    $('carLevel').textContent = label;
    $('carLevel').style.color = `var(${color})`;
    $('carReason').textContent = REASON[s.reason] ?? s.reason;
    $('carDriving').textContent = s.parked ? '정차' : `${s.drivingMin}분째 · 다음 휴식 ${Math.max(0, s.nextBreakInMin)}분`;
    $('carEvent').textContent = s.lastEvent ?? '-';
    $('carStress').textContent = (s.stress ?? '-') + (s.mood ? ` · 기분 ${MOOD[s.mood]}` : '');
  }

  const condition = () => ({
    sleepMinutes: +$('sleep').value,
    energyScore: +$('energy').value,
    restingHr: +$('resting').value,
    sleepApnea: $('apnea').checked,
    recentIhrn: $('recentIhrn').checked,
    exerciseEndedMinAgo: $('exercise').checked ? 10 : null,
    nightSpo2Min: +$('spo2').value,
    skinTempDeltaC: +$('skin').value,
    systolicBp: +$('bp').value,
    baselineRmssd: +$('baseRmssd').value,
    mood: $('mood').value || null,
  });
  const sendCondition = () => send({ type: 'condition', condition: condition() });

  let jitter = 0;
  const sendLive = () => send({
    type: 'live',
    hr: +$('hr').value + jitter,
    glucose: $('glucoseOn').checked ? +$('glucose').value : null,
    rmssd: $('hrvOn').checked ? +$('rmssd').value : null,
  });
  // Same formula as the car (Hrv.stress): 0 at baseline, 100 at 40% of baseline.
  const stressOf = (rmssd) => Math.max(0, Math.min(100, Math.round((1 - rmssd / +$('baseRmssd').value) / 0.6 * 100)));

  function labels() {
    const m = +$('sleep').value;
    $('sleepOut').textContent = `${Math.floor(m / 60)}시간 ${m % 60}분`;
    $('energyOut').textContent = $('energy').value;
    $('restingOut').textContent = `${$('resting').value} bpm`;
    $('hrOut').textContent = `${+$('hr').value + jitter} bpm`;
    $('glucoseOut').textContent = $('glucoseOn').checked ? `${$('glucose').value} mg/dL` : '';
    $('glucose').disabled = !$('glucoseOn').checked;
    $('spo2Out').textContent = `${$('spo2').value}%`;
    $('skinOut').textContent = `${+$('skin').value > 0 ? '+' : ''}${(+$('skin').value).toFixed(1)}℃`;
    $('bpOut').textContent = `${$('bp').value} mmHg`;
    $('baseRmssdOut').textContent = `${$('baseRmssd').value} ms`;
    $('rmssdOut').textContent = $('hrvOn').checked ? `${$('rmssd').value} ms · 스트레스 ${stressOf(+$('rmssd').value)}` : '';
    $('rmssd').disabled = !$('hrvOn').checked;
  }

  ['sleep', 'energy', 'resting', 'spo2', 'skin', 'bp', 'baseRmssd'].forEach((id) => $(id).addEventListener('input', labels));
  ['hr', 'glucose', 'glucoseOn', 'rmssd', 'hrvOn'].forEach((id) => $(id).addEventListener('input', () => { labels(); sendLive(); }));
  $('sendCondition').onclick = sendCondition;
  $('sendIhrn').onclick = () => send({ type: 'ihrn' });
  $('driveOn').onclick = () => send({ type: 'drive', driving: true });
  $('driveOff').onclick = () => send({ type: 'drive', driving: false });
  $('driveReal').onclick = () => send({ type: 'drive', driving: null });
  $('adv10').onclick = () => send({ type: 'advance', minutes: 10 });
  $('adv30').onclick = () => send({ type: 'advance', minutes: 30 });
  $('scenario').onclick = () => send({ type: 'scenario' });

  // A watch reports heart rate about once a second. Real heart rate is never flat:
  // it drifts slowly (random walk pulled back to the slider) and rises and falls with breathing (~5 s).
  let drift = 0, t = 0;
  setInterval(() => {
    t += 1;
    if ($('jitter').checked) {
      drift = drift * 0.85 + (Math.random() - 0.5) * 3;
      const breath = 2.5 * Math.sin((2 * Math.PI * t) / 5);
      jitter = Math.round(drift + breath);
    } else {
      jitter = 0;
    }
    labels();
    sendLive();
  }, 1000);

  labels();
  connect();
</script>
</body>
</html>
